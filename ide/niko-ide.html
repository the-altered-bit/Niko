html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace}
#app{height:100%;display:flex;flex-direction:column;min-height:0}

#title{height:38px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--bg2);border-bottom:1px solid var(--border)}
#title .brand{display:inline-flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.2px;margin-right:6px;white-space:nowrap}
#title .brand img{width:22px;height:22px}
#title .sp{flex:1}
.btn{height:26px;padding:0 10px;border-radius:4px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.run{background:var(--ok);color:#fff;font-weight:600}
.btn.stop{background:var(--err);color:#fff;font-weight:600}
.btn.pal{border:1px solid var(--border);color:var(--muted);min-width:0}
#burger{display:none;font-size:18px;width:30px}

#main{flex:1;display:flex;min-height:0;position:relative}
#activity{width:46px;flex:none;background:var(--act);display:flex;flex-direction:column;align-items:center}
#activity button{width:46px;height:46px;color:var(--actfg);display:flex;align-items:center;justify-content:center}
#activity button:hover{color:#fff}
#activity button.on{color:#fff;box-shadow:inset 2px 0 0 #fff}
#activity svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#sidebar{width:260px;flex:none;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;overflow:auto}
.nosb #sidebar{display:none}
.sh{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 6px;font-size:11px;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.sh button{width:22px;height:22px;border-radius:3px;font-size:15px;color:var(--fg)}
.sh button:hover{background:var(--hover)}
.fi{display:flex;align-items:center;gap:6px;padding:4px 12px;cursor:pointer;min-height:26px}
.fi:hover{background:var(--hover)}
.fi.on{background:var(--sel)}
.fi .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .fa{display:none;gap:2px}
.fi:hover .fa,.fi.on .fa{display:flex}
.fa button{width:22px;height:22px;border-radius:3px;color:var(--muted)}
.fa button:hover{background:var(--hover);color:var(--fg)}
.dot{width:10px;height:10px;border-radius:2px;background:var(--c-stmt);flex:none}
.side-in{margin:6px 12px;display:block;width:calc(100% - 24px);padding:5px 8px;background:var(--input);color:var(--fg);border:1px solid var(--border);border-radius:3px;outline:0}
.side-in:focus{border-color:var(--accent)}
.res-file{padding:6px 12px 2px;font-weight:600}
.res{padding:2px 12px 2px 22px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.res:hover{background:var(--hover)}
.res b{color:var(--c-const)}
.ref{padding:2px 12px 10px}
.ref h4{margin:12px 0 4px;font-size:12px}
.ref pre{margin:0 0 4px;padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:12px;line-height:1.5;white-space:pre-wrap;cursor:pointer}
.ref pre:hover{border-color:var(--accent)}
.ref p{margin:2px 0 6px;color:var(--muted);font-size:12px}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:6px 12px}
.seg{display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.seg button{padding:3px 10px}
.seg button.on{background:var(--accent);color:#fff}
.kbd{padding:2px 12px;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.kbd span:last-child{color:var(--fg)}

#editorArea{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#tabs{display:flex;flex:none;overflow-x:auto;background:var(--bg2);scrollbar-width:none;border-bottom:1px solid var(--border)}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;height:35px;flex:none;background:var(--tab);border-right:1px solid var(--border);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--tabOn);color:var(--fg);box-shadow:inset 0 1px 0 var(--accent)}
.tab .x{width:20px;height:20px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:12px}
.tab .x:hover{background:var(--hover)}
.tab .mod{width:8px;height:8px;border-radius:50%;background:var(--fg);display:block}
.tab .x .mod+span{display:none}
.tab.dirty .x span{display:none}
.tab:not(.dirty) .mod{display:none}
.tab.dirty:hover .x span{display:inline}
.tab.dirty:hover .mod{display:none}

#code{flex:1;position:relative;min-height:0;overflow:hidden;background:var(--bg);display:flex}
#gutter{flex:none;overflow:hidden;position:relative;color:var(--muted);text-align:right;user-select:none;-webkit-user-select:none}
#gin{padding:8px 0}
.ln{height:var(--lh);line-height:var(--lh);padding-right:12px;font-size:var(--fs)}
.ln.cur{color:var(--fg)}
.ln.err{color:var(--err);font-weight:700}
#edit{flex:1;position:relative;min-width:0;overflow:hidden}
#cur{position:absolute;left:0;right:0;height:var(--lh);background:var(--line);pointer-events:none}
#hl,#ta{position:absolute;inset:0;margin:0;border:0;padding:8px 80px 60vh 12px;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace;font-size:var(--fs);line-height:var(--lh);white-space:pre;tab-size:4;letter-spacing:0;font-variant-ligatures:none;word-spacing:0}
#hl{overflow:hidden;pointer-events:none;color:var(--fg)}
#ta{background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--fg);resize:none;outline:0;overflow:auto;scrollbar-width:none;padding-bottom:40vh;padding-right:12px;border-radius:0}
#ta::-webkit-scrollbar{display:none}
#ta::selection{background:var(--sel);-webkit-text-fill-color:transparent}
.t-ctrl{color:var(--c-ctrl)}.t-stmt{color:var(--c-stmt)}.t-str{color:var(--c-str)}.t-num{color:var(--c-num)}
.t-com{color:var(--c-com);font-style:italic}.t-fn{color:var(--c-fn)}.t-const{color:var(--c-const)}.t-op{color:var(--c-op)}.t-built{color:var(--c-built)}
#ac{position:absolute;z-index:20;display:none;min-width:190px;max-width:80%;max-height:190px;overflow:auto;background:var(--bg2);border:1px solid var(--border);border-radius:4px;box-shadow:0 4px 14px #0006;font-size:13px}
#ac .it{display:flex;justify-content:space-between;gap:14px;padding:4px 10px;cursor:pointer}
#ac .it small{color:var(--muted)}
#ac .it.on{background:var(--accent);color:#fff}
#ac .it.on small{color:#ffffffb0}

#panel{flex:none;height:220px;display:flex;flex-direction:column;border-top:1px solid var(--border);background:var(--bg);min-height:70px;position:relative}
.nopanel #panel{display:none}
#pres{position:absolute;left:0;right:0;top:-4px;height:8px;cursor:ns-resize;z-index:5;touch-action:none}
#pres:hover{background:var(--accent);opacity:.5}
#ptabs{display:flex;align-items:center;gap:16px;padding:0 12px;height:32px;flex:none;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.ptab{height:32px;display:flex;align-items:center;gap:6px;border-bottom:1px solid transparent}
.ptab.on{color:var(--fg);border-bottom-color:var(--accent)}
.badge{background:var(--err);color:#fff;border-radius:9px;padding:0 6px;font-size:10px;letter-spacing:0}
#ptabs .sp{flex:1}
#ptabs button.ic{width:26px;height:26px;border-radius:3px;font-size:14px;color:var(--muted);text-transform:none}
#ptabs button.ic:hover{background:var(--hover);color:var(--fg)}
#out,#probs{flex:1;overflow:auto;padding:4px 14px 10px;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace;font-size:13px;min-height:0}
#out{white-space:pre-wrap;word-break:break-word}
#probs{display:none}
#repl{flex:1;min-height:0;display:none;flex-direction:column;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace;font-size:13px}
#rlog{flex:1;overflow:auto;padding:4px 14px;white-space:pre-wrap;word-break:break-word;min-height:0}
#rrow{display:flex;gap:8px;align-items:center;padding:4px 14px 8px;flex:none}
#rprompt{color:var(--c-const)}
#rin{flex:1;min-width:60px;background:var(--input);color:var(--fg);border:1px solid var(--border);border-radius:3px;padding:3px 6px;font:inherit;outline:0}
#rin:focus{border-color:var(--accent)}
.oerr{color:var(--err)}.oinfo{color:var(--muted)}.osys{color:var(--c-const)}
.outrow{display:flex;gap:6px;align-items:center}
.outrow input{flex:1;min-width:60px;background:var(--input);color:var(--fg);border:1px solid var(--accent);border-radius:3px;padding:2px 6px;font:inherit;outline:0}
.pr{display:flex;gap:10px;padding:4px 0;cursor:pointer;font-family:system-ui,sans-serif}
.pr:hover{background:var(--hover)}
.pr .ic{color:var(--err)}
.pr small{color:var(--muted);margin-left:auto;white-space:nowrap}
.empty{color:var(--muted);padding:8px 0;font-family:system-ui,sans-serif}

#keys{display:none;flex:none;overflow-x:auto;background:var(--bg2);border-top:1px solid var(--border);scrollbar-width:none}
#keys button{min-width:42px;height:38px;flex:none;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:15px}
#keys button:active{background:var(--hover)}
#status{height:24px;flex:none;background:var(--status);color:var(--statusfg);display:flex;align-items:center;gap:14px;padding:0 10px;font-size:12px;white-space:nowrap;overflow:hidden}
#status .sp{flex:1}
#status button{padding:0 4px;height:100%}
#status button:hover{background:#ffffff26}

#ov{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 56px);background:#0005}
#box{width:min(580px,94%);background:var(--bg2);border:1px solid var(--border);border-radius:6px;box-shadow:0 10px 34px #0007;overflow:hidden}
#boxt{padding:8px 12px 0;color:var(--muted);font-size:12px;display:none}
#bin{width:100%;padding:10px 12px;background:var(--input);color:var(--fg);border:0;border-bottom:1px solid var(--border);outline:0;font-size:15px}
#blist{max-height:48vh;overflow:auto}
.pi{padding:7px 12px;display:flex;justify-content:space-between;gap:12px;cursor:pointer}
.pi small{color:var(--muted)}
.pi.on{background:var(--accent);color:#fff}
.pi.on small{color:#ffffffb0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);transform:translateX(-50%);background:var(--bg2);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:7px 14px;box-shadow:0 4px 16px #0006;z-index:120;display:none}

@media (max-width:720px){
  #burger{display:inline-flex}
  #keys{display:flex}
  #sidebar{position:absolute;left:46px;top:0;bottom:0;z-index:30;width:min(78%,310px);box-shadow:6px 0 22px #0007}
  #panel{height:170px}
  .btn.pal span{display:none}
  #status .hide-m{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
</style>

/* ---------- highlighting ---------- */
const TOK=/#.*|"(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?|\d+(?:\.\d+)?|[A-Za-z_]\w*|[\s\S]/g;
const CTRL=new Set('if otherwise repeat times for each in while stop skip to with give back forever'.split(' '));
const STMT=new Set('set add take put remove say ask into of from'.split(' '));
const OPW=new Set('is not and or bigger smaller than at least most'.split(' '));
const CONST=new Set(['yes','no','nothing']);
const BUILT=new Set('length item numbers random keys text number upper lower round floor ceil sqrt abs max min sum sorted reversed join split sleep pi trim replace starts_with ends_with count_of average unique pick read_file write_file append_file file_exists read_lines today now'.split(' '));
function highlight(src){
  let html='',prev='',first='',m;TOK.lastIndex=0;
  while((m=TOK.exec(src))){
    const t=m[0];let c='';
    if(t==='\n'){html+='\n';prev='';first='';continue;}
    if(t[0]==='#')c='com';
    else if(t[0]==='"'||t[0]==="'")c='str';
    else if(/^\d/.test(t))c='num';
    else if(/^[A-Za-z_]/.test(t)){
      if(!first)first=t;
      if(t==='number'&&prev==='ask')c='stmt';
      else if(prev==='to'&&first==='to')c='fn';
      else if(CTRL.has(t))c='ctrl';
      else if(STMT.has(t))c='stmt';
      else if(OPW.has(t))c='op';
      else if(CONST.has(t))c='const';
      else if(BUILT.has(t))c='built';
      else if(src[TOK.lastIndex]==='(')c='fn';
      prev=t;
    }
    html+=c?`<span class="t-${c}">${esc(t)}</span>`:esc(t);
  }
  return html+'\n';
}

/* ---------- editor rendering ---------- */
function updateGutter(){
  const n=ta.value.split('\n').length,digits=Math.max(2,String(n).length);
  gutter.style.width=Math.round(digits*CW+28)+'px';
  let h='';for(let i=1;i<=n;i++)h+=`<div class="ln${errLines.has(i)?' err':''}${i===curLine?' cur':''}">${i}</div>`;
  gin.innerHTML=h;
}
function syncScroll(){
  hl.scrollTop=ta.scrollTop;hl.scrollLeft=ta.scrollLeft;
  gin.style.transform=`translateY(${-ta.scrollTop}px)`;
  curEl.style.top=(8+(curLine-1)*LH-ta.scrollTop)+'px';
  closeAc();
}
function render(){hl.innerHTML=highlight(ta.value);updateGutter();syncScroll();}
function caretInfo(){
  const v=ta.value,s=ta.selectionStart,before=v.slice(0,s),line=before.split('\n').length,col=s-before.lastIndexOf('\n');
  return{line,col};
}
function updatePos(){
  const{line,col}=caretInfo();
  $('#stPos').textContent=`Ln ${line}, Col ${col}`;
  if(line!==curLine){curLine=line;updateGutter();}
  curEl.style.top=(8+(curLine-1)*LH-ta.scrollTop)+'px';
}
function loadEditor(){
  const f=cur();ta.value=f.content;curLine=1;
  render();
  ta.setSelectionRange(f.sel?f.sel[0]:0,f.sel?f.sel[1]:0);
  if(f.scroll){ta.scrollTop=f.scroll[0];ta.scrollLeft=f.scroll[1];}
  syncScroll();updatePos();runDiagnostics();
}
function stash(){const f=cur();if(f){f.sel=[ta.selectionStart,ta.selectionEnd];f.scroll=[ta.scrollTop,ta.scrollLeft];}}

/* ---------- diagnostics ---------- */
let diagT=0;
function runDiagnostics(){
  clearTimeout(diagT);
  diagT=setTimeout(()=>{
    problems=diagnose(ta.value).problems;
    errLines=new Set(problems.map(p=>p.line));
    updateGutter();renderProblems();
  },300);
}
function renderProblems(){
  const n=problems.length,b=$('#pbadge');
  b.style.display=n?'inline':'none';b.textContent=n;
  $('#stProb').textContent='\u2716 '+n;
  probs.innerHTML=n?problems.map(p=>`<div class="pr" data-line="${p.line}"><span class="ic">\u2716</span><span>${esc(p.msg)}</span><small>${esc(cur().name)} [Ln ${p.line}]</small></div>`).join(''):'<div class="empty">No problems found in this file.</div>';
}

/* ---------- tabs / files ---------- */
function renderTabs(){
  $('#tabs').innerHTML=S.open.map(id=>{const f=S.files.find(x=>x.id===id);if(!f)return'';const d=f.content!==f.saved;
    return `<div class="tab${id===S.active?' on':''}${d?' dirty':''}" data-id="${id}" role="tab"><span>${esc(f.name)}</span><button class="x" data-close="${id}" aria-label="Close ${esc(f.name)}"><i class="mod"></i><span>\u2715</span></button></div>`;}).join('');
  const on=$('#tabs .tab.on');if(on)on.scrollIntoView({block:'nearest',inline:'nearest'});
}
function openFile(id){if(!S.open.includes(id))S.open.push(id);switchTo(id);}
function switchTo(id){stash();S.active=id;loadEditor();renderTabs();renderSidebar();persist();}
function closeTab(id){
  stash();const i=S.open.indexOf(id);if(i<0)return;S.open.splice(i,1);
  if(!S.open.length){const other=S.files.find(f=>f.id!==id)||null;if(other)S.open.push(other.id);else{const nf=mkFile('untitled.niko','');S.open.push(nf.id);}}
  if(S.active===id||!S.open.includes(S.active))S.active=S.open[Math.min(i,S.open.length-1)];
  loadEditor();renderTabs();renderSidebar();persist();
}
function uniqueName(n){
  if(!/\.[a-z]+$/i.test(n))n+='.niko';
  let base=n.replace(/\.[^.]+$/,''),ext=n.slice(base.length),k=1,name=n;
  while(S.files.some(f=>f.name===name))name=base+(++k)+ext;return name;
}
function mkFile(name,content){const f={id:uid(),name:uniqueName(name),content,saved:content};S.files.push(f);return f;}
function newFile(){askText('New file name','untitled.niko',v=>{if(!v)return;const f=mkFile(v.trim(),'');openFile(f.id);ta.focus();});}
function renameFile(id){const f=S.files.find(x=>x.id===id);askText('Rename file',f.name,v=>{v=(v||'').trim();if(!v||v===f.name)return;f.name=uniqueName(v);renderTabs();renderSidebar();persist();});}
function deleteFile(id){
  const f=S.files.find(x=>x.id===id);
  openBox({title:'Delete "'+f.name+'"? This cannot be undone.',noInput:true,items:()=>[{label:'Delete',run:()=>{
    S.files=S.files.filter(x=>x.id!==id);S.open=S.open.filter(x=>x!==id);
    if(!S.files.length){const nf=mkFile('untitled.niko','');S.open=[nf.id];}
    if(!S.open.length)S.open=[S.files[0].id];
    if(!S.open.includes(S.active))S.active=S.open[0];
    loadEditor();renderTabs();renderSidebar();persist();}},{label:'Cancel',run:()=>{}}]});
}
function saveFile(){const f=cur();f.saved=f.content;renderTabs();persist();toast('Saved '+f.name);}

function doSearch(){
  const q=(S.q||'').toLowerCase(),r=$('#sres');if(!r)return;
  if(!q){r.innerHTML='';return;}
  let h='',total=0;
  for(const f of S.files){
    const hits=[];f.content.split('\n').forEach((ln,i)=>{const k=ln.toLowerCase().indexOf(q);if(k>=0)hits.push({i,k,ln});});
    if(!hits.length)continue;total+=hits.length;
    h+=`<div class="res-file">${esc(f.name)} <small>${hits.length}</small></div>`+hits.slice(0,50).map(x=>`<div class="res" data-id="${f.id}" data-line="${x.i+1}" data-col="${x.k}" data-len="${q.length}">${esc(x.ln.slice(0,x.k).trimStart())}<b>${esc(x.ln.slice(x.k,x.k+q.length))}</b>${esc(x.ln.slice(x.k+q.length))}</div>`).join('');
  }
  r.innerHTML=total?h:'<div class="empty" style="padding:8px 12px">No results.</div>';
}
function setView(v){
  if(S.sidebar&&S.view===v){S.sidebar=false;}else{S.view=v;S.sidebar=true;}
  renderSidebar();persist();
  if(S.sidebar&&v==='search'){const q=$('#sq');if(q)q.focus();}
}
function goTo(line,col=0,len=0){
  const v=ta.value.split('\n');let off=0;for(let i=0;i<line-1&&i<v.length;i++)off+=v[i].length+1;
  ta.focus();ta.setSelectionRange(off+col,off+col+len);
  ta.scrollTop=Math.max(0,(line-4)*LH);ta.scrollLeft=0;syncScroll();updatePos();
  if(isMobile()&&S.sidebar){S.sidebar=false;renderSidebar();}
}

/* ---------- editing helpers ---------- */
function replaceRange(s,e,text,selS,selE){
  ta.focus();ta.setSelectionRange(s,e);
  let ok=false;try{ok=document.execCommand('insertText',false,text);}catch(_){}
  if(!ok||ta.value.slice(s,s+text.length)!==text){ta.setRangeText(text,s,e,'end');ta.dispatchEvent(new Event('input'));}
  if(selS!=null)ta.setSelectionRange(selS,selE==null?selS:selE);
  updatePos();
}
function lineRange(){
  const v=ta.value,s=ta.selectionStart,e=ta.selectionEnd,a=v.lastIndexOf('\n',s-1)+1;
  let b=v.indexOf('\n',e>s&&v[e-1]==='\n'?e-1:e);if(b<0)b=v.length;return[a,b];
}
function indentSel(out){
  const s=ta.selectionStart,e=ta.selectionEnd,[a,b]=lineRange(),lines=ta.value.slice(a,b).split('\n');
  if(!out){replaceRange(a,b,lines.map(l=>'    '+l).join('\n'),s+4,e+4*lines.length);return;}
  let first=0,total=0;
  const nl=lines.map((l,i)=>{const m=/^( {1,4}|\t)/.exec(l),r=m?m[0].length:0;if(i===0)first=r;total+=r;return l.slice(r);});
  replaceRange(a,b,nl.join('\n'),Math.max(a,s-first),Math.max(a,e-total));
}
function toggleComment(){
  const s=ta.selectionStart,e=ta.selectionEnd,[a,b]=lineRange(),lines=ta.value.slice(a,b).split('\n');
  const body=lines.filter(l=>l.trim());if(!body.length)return;
  const all=body.every(l=>/^\s*#/.test(l));
  const minInd=Math.min(...body.map(l=>l.match(/^\s*/)[0].length));
  let delta0=0,total=0;
  const nl=lines.map((l,i)=>{
    if(!l.trim())return l;let d;
    if(all){const m=/^(\s*)# ?/.exec(l);d=-(m[0].length-m[1].length);l=m[1]+l.slice(m[0].length);}
    else{l=l.slice(0,minInd)+'# '+l.slice(minInd);d=2;}
    if(i===0)delta0=d;total+=d;return l;
  });
  replaceRange(a,b,nl.join('\n'),Math.max(a,s+delta0),Math.max(a,e+total));
}
function moveLines(dir){
  const v=ta.value,s=ta.selectionStart,e=ta.selectionEnd,[a,b]=lineRange(),block=v.slice(a,b);
  if(dir<0){if(a===0)return;const ps=v.lastIndexOf('\n',a-2)+1,prev=v.slice(ps,a-1);replaceRange(ps,b,block+'\n'+prev,s-prev.length-1,e-prev.length-1);}
  else{if(b>=v.length)return;let ne=v.indexOf('\n',b+1);if(ne<0)ne=v.length;const next=v.slice(b+1,ne);replaceRange(a,ne,next+'\n'+block,s+next.length+1,e+next.length+1);}
}
function dupLines(){const s=ta.selectionStart,e=ta.selectionEnd,[,b]=lineRange(),blk=ta.value.slice(lineRange()[0],b);replaceRange(b,b,'\n'+blk,s+blk.length+1,e+blk.length+1);}

/* ---------- autocomplete ---------- */
const SNIP=[
['set','set $0 to ','store a value'],['say','say $0','show something'],['ask','ask "$0" into answer','ask for text'],['ask number','ask number "$0" into answer','ask for a number'],
['add','add $0 to total','make bigger'],['take','take $0 from total','make smaller'],['put','put $0 in list','add to a list'],['remove','remove $0 from list','take out of a list'],
['if','if $0:\n    ','decision'],['otherwise','otherwise:\n    $0','else'],['otherwise if','otherwise if $0:\n    ','else if'],
['repeat','repeat $0 times:\n    ','loop'],['repeat forever','repeat forever:\n    $0','loop'],['for each','for each item in $0:\n    ','loop over a list'],['while','while $0:\n    ','loop'],
['to','to $0 with x:\n    give back x','function'],['give back','give back $0','return a value'],['stop','stop','leave loop'],['skip','skip','next round'],
['length of','length of $0','size of a list'],['item','item $0 of list','list position'],['numbers','numbers 1 to $0','counting list'],['random','random 1 to $0','random number'],
['yes','yes',''],['no','no',''],['nothing','nothing',''],
...'keys text number upper lower round floor ceil sqrt abs max min sum sorted reversed join split sleep trim replace starts_with ends_with count_of average unique pick read_file write_file append_file file_exists read_lines today now'.split(' ').map(n=>[n,n+'($0)','helper']),['pi','pi','constant']
];
let acItems=[],acIdx=0,acPrefix='';
function closeAc(){ac.style.display='none';acItems=[];}
function updateAc(){
  const v=ta.value,s=ta.selectionStart;
  if(s!==ta.selectionEnd){closeAc();return;}
  const ls=v.lastIndexOf('\n',s-1)+1,before=v.slice(ls,s);
  const m=/[A-Za-z_]\w*$/.exec(before);
  if(!m){closeAc();return;}
  const noStr=before.replace(/"[^"]*"|'[^']*'/g,'');
  if(noStr.includes('#')||(before.match(/["']/g)||[]).length%2){closeAc();return;}
  const pre=m[0].toLowerCase(),dyn=[];
  for(const x of v.matchAll(/^\s*to (\w+)/gm))dyn.push([x[1],x[1]+'($0)','function']);
  for(const x of v.matchAll(/^\s*set (\w+) to/gm))dyn.push([x[1],x[1],'variable']);
  const seen=new Set();
  acItems=[...dyn,...SNIP].filter(it=>it[0].toLowerCase().startsWith(pre)&&!seen.has(it[0]+it[2])&&seen.add(it[0]+it[2])).slice(0,8);
  if(!acItems.length||(acItems.length===1&&acItems[0][0].toLowerCase()===pre)){closeAc();return;}
  acPrefix=m[0];acIdx=0;
  const{line,col}=caretInfo();
  ac.style.left=Math.min(gutter.offsetWidth+12+(col-1-acPrefix.length)*CW-ta.scrollLeft,Math.max(0,$('#code').clientWidth-200))+'px';
  const y=8+line*LH-ta.scrollTop,ch=$('#code').clientHeight;
  ac.style.top=(y+190>ch?Math.max(0,y-LH-Math.min(190,acItems.length*26+4)):y)+'px';
  paintAc();ac.style.display='block';
}
function paintAc(){ac.innerHTML=acItems.map((it,i)=>`<div class="it${i===acIdx?' on':''}" data-i="${i}"><span>${esc(it[0])}</span><small>${esc(it[2])}</small></div>`).join('');const on=ac.querySelector('.on');if(on)on.scrollIntoView({block:'nearest'});}
function acAccept(i){
  const it=acItems[i==null?acIdx:i];if(!it)return;
  const s=ta.selectionStart,v=ta.value,ls=v.lastIndexOf('\n',s-1)+1,ind=v.slice(ls).match(/^ */)[0];
  const t=it[1].replace(/\n/g,'\n'+ind),k=t.indexOf('$0'),text=t.replace('$0','');
  const start=s-acPrefix.length;closeAc();
  replaceRange(start,s,text,start+(k<0?text.length:k));
}

/* ---------- key handling ---------- */
const PAIRS={'(':')','[':']','{':'}','"':'"',"'":"'"},CLOSERS=new Set([')',']','}','"',"'"]);
ta.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(ac.style.display==='block'){
    if(e.key==='ArrowDown'){acIdx=(acIdx+1)%acItems.length;paintAc();e.preventDefault();return;}
    if(e.key==='ArrowUp'){acIdx=(acIdx-1+acItems.length)%acItems.length;paintAc();e.preventDefault();return;}
    if(e.key==='Tab'||(e.key==='Enter'&&!mod)){acAccept();e.preventDefault();return;}
    if(e.key==='Escape'){closeAc();e.preventDefault();return;}
  }
  const v=ta.value,s=ta.selectionStart,en=ta.selectionEnd;
  if(e.key==='Tab'){e.preventDefault();
    if(e.shiftKey)indentSel(true);
    else if(s!==en&&v.slice(s,en).includes('\n'))indentSel(false);
    else replaceRange(s,en,'    ',s+4);
    return;}
  if(e.key==='Enter'&&!mod&&!e.altKey){
    e.preventDefault();
    const ls=v.lastIndexOf('\n',s-1)+1,before=v.slice(ls,s),ind=before.match(/^\s*/)[0];
    const extra=/:$/.test(stripComment(before.trim()))?'    ':'',t='\n'+ind+extra;
    replaceRange(s,en,t,s+t.length);return;}
  if(e.key==='Backspace'&&s===en&&s>0&&!mod){
    const prev=v[s-1],next=v[s];
    if(PAIRS[prev]&&PAIRS[prev]===next){e.preventDefault();replaceRange(s-1,s+1,'',s-1);return;}
    const ls=v.lastIndexOf('\n',s-1)+1,before=v.slice(ls,s);
    if(before&&/^ +$/.test(before)){e.preventDefault();const n=before.length%4||4;replaceRange(s-n,s,'',s-n);return;}
  }
  if(mod&&e.key==='/'){e.preventDefault();toggleComment();return;}
  if(e.altKey&&!e.shiftKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();moveLines(e.key==='ArrowUp'?-1:1);return;}
  if(e.altKey&&e.shiftKey&&e.key==='ArrowDown'){e.preventDefault();dupLines();return;}
  if(!mod&&!e.altKey&&PAIRS[e.key]){
    const k=e.key,c=PAIRS[k];
    if(s!==en){e.preventDefault();replaceRange(s,en,k+v.slice(s,en)+c,s+1,en+1);return;}
    const next=v[s],prev=v[s-1]||'';
    if((k==='"'||k==="'")&&next===k){e.preventDefault();ta.setSelectionRange(s+1,s+1);updatePos();return;}
    if(k==="'"&&/\w/.test(prev))return;
    if(k==='"'&&/\w/.test(prev))return;
    if(k==='"'||k==="'"||next===undefined||/[\s)\]}:,;]/.test(next)){e.preventDefault();replaceRange(s,s,k+c,s+1);return;}
  }
  if(!mod&&CLOSERS.has(e.key)&&s===en&&v[s]===e.key){e.preventDefault();ta.setSelectionRange(s+1,s+1);updatePos();return;}
});
ta.addEventListener('input',()=>{
  const f=cur();f.content=ta.value;
  render();updatePos();runDiagnostics();renderTabs();persist();updateAc();
});
ta.addEventListener('scroll',syncScroll);
ta.addEventListener('blur',()=>setTimeout(closeAc,150));
ta.addEventListener('pointerdown',closeAc);
document.addEventListener('selectionchange',()=>{if(document.activeElement===ta)updatePos();});
ac.addEventListener('pointerdown',e=>{e.preventDefault();const it=e.target.closest('.it');if(it)acAccept(+it.dataset.i);});

/* ---------- run ---------- */
let running=false,stopFlag=false,pending=null,lastYield=0,target=out;
const STOP={stopped:true},st={l:0};
function println(t,cls){const d=document.createElement('div');if(cls)d.className=cls;d.textContent=t;target.appendChild(d);while(target.childNodes.length>3000)target.removeChild(target.firstChild);target.scrollTop=target.scrollHeight;return d;}
function say(...a){println(a.map(x=>fmt(x)).join(' '));}
function ask(prompt){
  return new Promise((resolve,reject)=>{
    const row=document.createElement('div'),lab=document.createElement('span'),inp=document.createElement('input');
    row.className='outrow';lab.textContent=fmt(prompt===undefined?'':prompt);
    inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;inp.setAttribute('aria-label','Program input');
    row.append(lab,inp);target.appendChild(row);target.scrollTop=target.scrollHeight;inp.focus();
    pending={reject,row,lab};
    inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){const val=inp.value;pending=null;row.className='';row.textContent=lab.textContent+val;resolve(val);}});
  });
}
async function askNumber(p){for(;;){const t=(await ask(p)).trim(),n=Number(t);if(t!==''&&!isNaN(n))return n;println('Please type a number.','oinfo');}}
async function tick(){
  const now=performance.now();
  if(now-lastYield>30){await new Promise(r=>setTimeout(r,0));lastYield=performance.now();if(stopFlag)throw STOP;}
}
async function sleep(s){await new Promise(r=>setTimeout(r,s*1000));if(stopFlag)throw STOP;}
function setRunning(r){
  running=r;$('#runBtn').style.display=r?'none':'';$('#stopBtn').style.display=r?'':'none';
  $('#stState').textContent=r?'Running\u2026':'Ready';
}
function showPanel(which){
  S.panel=true;applyLayout();
  $$('.ptab').forEach(b=>b.classList.toggle('on',b.dataset.p===which));
  out.style.display=which==='out'?'':'none';probs.style.display=which==='probs'?'block':'none';
  $('#repl').style.display=which==='repl'?'flex':'none';
  if(which==='repl'&&!isMobile())setTimeout(()=>$('#rin').focus(),0);
}
async function runProgram(){
  if(running)return;
  showPanel('out');target=out;out.innerHTML='';
  const src=ta.value,name=cur().name,d=diagnose(src);
  problems=d.problems;errLines=new Set(problems.map(p=>p.line));updateGutter();renderProblems();
  if(problems.length){
    const lines=src.split('\n');
    println(`Can't run ${name} yet:`,'oerr');
    problems.slice(0,6).forEach(p=>println(`  line ${p.line}: ${p.msg}${lines[p.line-1]?'  ->  '+lines[p.line-1].trim():''}`,'oerr'));
    return;
  }
  println(`> Running ${name}`,'osys');
  const env=Object.assign({},LIB,{say,ask,askNumber,__tick:tick,__st:st,sleep});
  let fn;try{fn=new AsyncFunction(...ENV,'"use strict";\n'+d.t.lines.join('\n')+d.t.tail);}catch(e){println('Oops: '+e.message,'oerr');return;}
  setRunning(true);stopFlag=false;st.l=0;lastYield=performance.now();
  try{await fn(...ENV.map(k=>env[k]));println('> Done','osys');}
  catch(e){
    if(e===STOP)println('> Stopped','osys');
    else println(`Oops on line ${st.l}: ${friendly(e,d.t.names)}`,'oerr');
  }
  pending=null;setRunning(false);
}
function stopProgram(){if(!running)return;stopFlag=true;if(pending){const p=pending;pending=null;p.row.className='';p.row.textContent=p.lab.textContent;p.reject(STOP);}}

/* ---------- REPL ---------- */
const rlog=$('#rlog'),rin=$('#rin'),rprompt=$('#rprompt');
const HELPTXT='Type a line and press Enter.\n  say "hi"          show something\n  set x to 5        make a variable (kept for the whole session)\n  x * 2             type an expression to see its value\n  if x is 5:        a line ending in ":" continues below;\n      say "five"    finish the block with an empty line\n  clear / reset     clear the screen / forget everything';
let rs=null,rhist=[],rhi=0,rbusy=false;
function newSession(){
  const store=Object.create(null);
  const base=Object.assign({},LIB,{say,ask,askNumber,__tick:tick,__st:st,sleep,__show(v){if(v!==undefined&&v!==null)println(fmt(v,true));}});
  rs={fns:new Set(),globals:new Set(),names:new Set(),block:null,
    proxy:new Proxy(store,{
      has:(t,k)=>typeof k==='string',
      get(t,k){if(typeof k!=='string')return undefined;if(k in t)return t[k];if(k in base)return base[k];if(k in globalThis)return globalThis[k];throw new ReferenceError(k+' is not defined');},
      set(t,k,v){t[k]=v;return true;}
    })};
}
function rEcho(text,cls){const d=document.createElement('div');if(cls)d.className=cls;d.textContent=text;rlog.appendChild(d);rlog.scrollTop=rlog.scrollHeight;}
async function replRun(src){
  const t=transpile(src,{repl:true,fns:rs.fns,globals:rs.globals,names:rs.names});
  if(t.errors.length){rEcho('Oops: '+t.errors[0].msg,'oerr');return;}
  let fn;
  try{fn=new AsyncFunction('__p','with(__p){'+t.lines.join('\n')+t.tail+'\n}');}
  catch(e){rEcho("Oops: that line doesn't make sense to me.",'oerr');return;}
  target=rlog;rbusy=true;setRunning(true);stopFlag=false;st.l=0;lastYield=performance.now();
  try{await fn(rs.proxy);}
  catch(e){if(e===STOP)rEcho('> Stopped','osys');else rEcho('Oops: '+friendly(e,rs.names),'oerr');}
  pending=null;rbusy=false;setRunning(false);target=out;
}
rin.addEventListener('keydown',async e=>{
  if(e.key==='ArrowUp'){if(rhi>0){rhi--;rin.value=rhist[rhi];}e.preventDefault();return;}
  if(e.key==='ArrowDown'){if(rhi<rhist.length){rhi++;rin.value=rhist[rhi]||'';}e.preventDefault();return;}
  if(e.key==='Tab'){e.preventDefault();rin.setRangeText('    ',rin.selectionStart,rin.selectionEnd,'end');return;}
  if(e.key!=='Enter'||rbusy)return;
  const v=rin.value;rin.value='';
  const opens=x=>/:$/.test(stripComment(x.trim()));
  if(rs.block){
    if(v.trim()===''){rEcho('...','oinfo');const src=rs.block.join('\n');rs.block=null;rprompt.textContent='niko>';await replRun(src);}
    else{rs.block.push(v);rEcho('...   '+v);rin.value=v.match(/^\s*/)[0]+(opens(v)?'    ':'');}
    rin.focus();return;
  }
  const s=v.trim();rEcho('niko> '+v);if(!s)return;
  rhist.push(v);rhi=rhist.length;
  if(s==='clear'){rlog.innerHTML='';return;}
  if(s==='reset'){newSession();rEcho('Session cleared.','osys');return;}
  if(s==='help'){rEcho(HELPTXT,'oinfo');return;}
  if(opens(s)){rs.block=[v];rprompt.textContent='...';rin.value='    ';return;}
  await replRun(v);rin.focus();
});
newSession();rEcho('Niko REPL. Type help for tips.','oinfo');

/* ---------- box (palette / prompts) ---------- */
let boxOpts=null,boxItems=[],boxIdx=0;
function openBox(o){
  boxOpts=o;const bin=$('#bin');
  $('#ov').style.display='flex';
  $('#boxt').style.display=o.title?'block':'none';$('#boxt').textContent=o.title||'';
  bin.style.display=o.noInput?'none':'block';bin.value=o.value||'';bin.placeholder=o.placeholder||'';
  paintBox();
  if(!o.noInput){bin.focus();if(o.value)bin.select();}
}
function closeBox(){$('#ov').style.display='none';boxOpts=null;if(document.activeElement)document.activeElement.blur&&0;}
function paintBox(){
  const o=boxOpts;if(!o||!o.items){$('#blist').innerHTML='';boxItems=[];return;}
  const q=$('#bin').value.toLowerCase();
  boxItems=o.items().filter(i=>i.label.toLowerCase().includes(q));boxIdx=Math.min(boxIdx,Math.max(0,boxItems.length-1));
  $('#blist').innerHTML=boxItems.map((i,n)=>`<div class="pi${n===boxIdx?' on':''}" data-i="${n}"><span>${esc(i.label)}</span><small>${esc(i.detail||'')}</small></div>`).join('');
}
function runBoxItem(n){const it=boxItems[n];closeBox();if(it)setTimeout(()=>it.run(),0);}
function askText(title,value,cb){openBox({title,value,onEnter:cb});}
$('#bin').addEventListener('input',()=>{boxIdx=0;paintBox();});
$('#bin').addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeBox();ta.focus();return;}
  if(e.key==='ArrowDown'){boxIdx=Math.min(boxItems.length-1,boxIdx+1);paintBox();e.preventDefault();}
  else if(e.key==='ArrowUp'){boxIdx=Math.max(0,boxIdx-1);paintBox();e.preventDefault();}
  else if(e.key==='Enter'){
    e.preventDefault();
    if(boxOpts&&boxOpts.items)runBoxItem(boxIdx);
    else if(boxOpts&&boxOpts.onEnter){const cb=boxOpts.onEnter,v=$('#bin').value;closeBox();cb(v);}
  }
});
$('#blist').addEventListener('click',e=>{const p=e.target.closest('.pi');if(p)runBoxItem(+p.dataset.i);});
$('#ov').addEventListener('pointerdown',e=>{if(e.target.id==='ov')closeBox();});

function formatDoc(){
  const lines=ta.value.replace(/\t/g,'    ').split('\n').map(l=>l.replace(/\s+$/,''));
  const res=[];let blank=0;for(const l of lines){if(!l){if(++blank>2)continue;}else blank=0;res.push(l);}
  while(res.length>1&&res[res.length-1]==='')res.pop();
  const t=res.join('\n')+'\n';replaceRange(0,ta.value.length,t,0);toast('Formatted');
}
function commands(){
  const c=[
    {label:'Run program',detail:'Ctrl+Enter',run:runProgram},
    {label:'Stop program',detail:'',run:stopProgram},
    {label:'Save file',detail:'Ctrl+S',run:saveFile},
    {label:'New file',detail:'',run:newFile},
    {label:'Rename current file',detail:'',run:()=>renameFile(S.active)},
    {label:'Delete current file',detail:'',run:()=>deleteFile(S.active)},
    {label:'Format document',detail:'',run:formatDoc},
    {label:'Go to line...',detail:'',run:()=>askText('Go to line','',v=>{const n=parseInt(v,10);if(n>0)goTo(n);})},
    {label:'Search in all files',detail:'Ctrl+Shift+F',run:()=>{S.view='search';S.sidebar=true;renderSidebar();const q=$('#sq');if(q)q.focus();}},
    {label:'Language reference',detail:'',run:()=>{S.view='ref';S.sidebar=true;renderSidebar();}},
    {label:'Toggle sidebar',detail:'Ctrl+B',run:()=>{S.sidebar=!S.sidebar;applyLayout();persist();}},
    {label:'Toggle panel',detail:'Ctrl+J',run:()=>{S.panel=!S.panel;applyLayout();persist();}},
    {label:'Show problems',detail:'',run:()=>showPanel('probs')},
    {label:'Open the REPL (try things live)',detail:'',run:()=>showPanel('repl')},
    {label:'Clear output',detail:'',run:()=>{out.innerHTML='';}},
    {label:'Switch light / dark theme',detail:'',run:toggleTheme},
    {label:'Increase font size',detail:'',run:()=>setFont(1)},
    {label:'Decrease font size',detail:'',run:()=>setFont(-1)},
    {label:'Copy all code',detail:'',run:async()=>{try{await navigator.clipboard.writeText(ta.value);toast('Copied');}catch(e){toast('Copy is blocked here');}}}
  ];
  EXAMPLES.forEach((e,i)=>c.push({label:'Open example: '+e[0],detail:'',run:()=>openExample(i)}));
  return c;
}
function openPalette(){openBox({placeholder:'Type a command',items:commands});}
function toggleTheme(){S.theme=S.theme==='dark'?'light':'dark';applyTheme();if(S.view==='settings')renderSidebar();persist();}
function setFont(d){S.fs=Math.max(11,Math.min(22,S.fs+d));applyFont();if(S.view==='settings')renderSidebar();persist();}
function openExample(i){
  const[n,c]=EXAMPLES[i],f=S.files.find(x=>x.name===n);
  if(f)openFile(f.id);else{const nf=mkFile(n,c);openFile(nf.id);}
  if(isMobile()){S.sidebar=false;renderSidebar();}
}

/* ---------- events ---------- */
$('#runBtn').onclick=()=>{ta.blur();runProgram();};
$('#stopBtn').onclick=stopProgram;
$('#palBtn').onclick=openPalette;
$('#themeBtn').onclick=toggleTheme;
$('#burger').onclick=()=>{S.sidebar=!S.sidebar;renderSidebar();persist();};
$('#stState').onclick=()=>showPanel('out');
$('#stProb').onclick=()=>showPanel('probs');
$('#stLang').onclick=()=>{S.view='ref';S.sidebar=true;renderSidebar();};
$('#clearBtn').onclick=()=>{if($('#repl').style.display==='flex')rlog.innerHTML='';else out.innerHTML='';};
$('#closePanel').onclick=()=>{S.panel=false;applyLayout();persist();};
$$('.ptab').forEach(b=>b.onclick=()=>showPanel(b.dataset.p));
$$('#activity button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
probs.addEventListener('click',e=>{const p=e.target.closest('.pr');if(p)goTo(+p.dataset.line);});
$('#tabs').addEventListener('click',e=>{
  const x=e.target.closest('[data-close]');if(x){e.stopPropagation();closeTab(x.dataset.close);return;}
  const t=e.target.closest('.tab');if(t&&t.dataset.id!==S.active)switchTo(t.dataset.id);
});
$('#sidebar').addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');
  if(a){e.stopPropagation();
    if(a.dataset.a==='new')newFile();else if(a.dataset.a==='ren')renameFile(a.dataset.id);else if(a.dataset.a==='del')deleteFile(a.dataset.id);return;}
  const fi=e.target.closest('.fi');
  if(fi){if(fi.dataset.ex!=null)openExample(+fi.dataset.ex);else{openFile(fi.dataset.id);if(isMobile()){S.sidebar=false;renderSidebar();}}return;}
  const r=e.target.closest('.res');
  if(r){if(r.dataset.id!==S.active)openFile(r.dataset.id);goTo(+r.dataset.line,+r.dataset.col,+r.dataset.len);return;}
  const rf=e.target.closest('[data-ref]');
  if(rf){const t=REF[+rf.dataset.ref][1]+'\n',s=ta.selectionStart;replaceRange(s,ta.selectionEnd,t,s+t.length);if(isMobile()){S.sidebar=false;renderSidebar();}return;}
  const th=e.target.closest('[data-theme]');if(th){S.theme=th.dataset.theme;applyTheme();renderSidebar();persist();return;}
  const fs=e.target.closest('[data-fs]');if(fs){setFont(+fs.dataset.fs);}
});
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&e.shiftKey&&k==='p'||e.key==='F1'){e.preventDefault();openPalette();}
  else if(mod&&e.key==='Enter'||e.key==='F5'){e.preventDefault();runProgram();}
  else if(mod&&k==='s'){e.preventDefault();saveFile();}
  else if(mod&&k==='b'){e.preventDefault();S.sidebar=!S.sidebar;applyLayout();persist();}
  else if(mod&&k==='j'){e.preventDefault();S.panel=!S.panel;applyLayout();persist();}
  else if(mod&&e.shiftKey&&k==='f'){e.preventDefault();S.view='search';S.sidebar=true;renderSidebar();const q=$('#sq');if(q)q.focus();}
  else if(e.key==='Escape'&&$('#ov').style.display==='flex'){closeBox();}
});
/* panel resize */
(function(){
  const h=$('#pres');let y0=0,h0=0,drag=false;
  h.addEventListener('pointerdown',e=>{drag=true;y0=e.clientY;h0=S.panelH;h.setPointerCapture(e.pointerId);});
  h.addEventListener('pointermove',e=>{if(!drag)return;S.panelH=Math.max(80,Math.min(window.innerHeight-200,h0+(y0-e.clientY)));$('#panel').style.height=S.panelH+'px';});
  h.addEventListener('pointerup',()=>{drag=false;persist();});
})();
/* mobile quick keys */
(function(){
  const keys=[['Tab','tab'],[':',':'],['"','"'],['(','('],[')',')'],['[','['],[']',']'],[',',','],['=','='],['+','+'],['#','#'],['\u25B6','run']];
  $('#keys').innerHTML=keys.map(k=>`<button data-k="${esc(k[1])}" aria-label="${esc(k[1])}">${esc(k[0])}</button>`).join('');
  $('#keys').addEventListener('pointerdown',e=>{
    const b=e.target.closest('button');if(!b)return;e.preventDefault();
    const k=b.dataset.k,s=ta.selectionStart,en=ta.selectionEnd;
    if(k==='run'){runProgram();return;}
    ta.focus();
    if(k==='tab')replaceRange(s,en,'    ',s+4);
    else if(k==='('||k==='['){replaceRange(s,en,k+(k==='('?')':']'),s+1);}
    else if(k==='"'){replaceRange(s,en,'""',s+1);}
    else replaceRange(s,en,k,s+k.length);
  });
})();

/* ---------- boot ---------- */
applyTheme();applyLayout();applyFont();renderSidebar();renderTabs();loadEditor();renderProblems();showPanel('out');
if(!out.childNodes.length)println('Press Run to run your program. Output and questions appear here.','oinfo');
window.addEventListener('resize',()=>{updateGutter();syncScroll();});
})();
</script>
