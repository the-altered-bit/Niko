<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niko 2 Playground (Alpha 29)</title>
<!--
  Niko 2 browser playground.
  External dependencies: exactly one — the pinned Pyodide build from
  https://cdn.jsdelivr.net/pyodide/v0.29.1/full/pyodide.js (see README.md).
  Everything else (the Niko compiler, stdlib, and example programs) is
  embedded in niko2_bundle.js, so this page works from file:// or any
  static host.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 880px; margin: 0 auto; padding: 1.2rem;
    line-height: 1.45;
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.2rem; }
  p.sub { color: #666; margin-top: 0; font-size: 0.95rem; }
  .toolbar { display: flex; gap: 0.6rem; align-items: center; margin: 0.8rem 0; flex-wrap: wrap; }
  #run {
    font-size: 1rem; padding: 0.45rem 1.2rem; cursor: pointer;
    background: #2f6f4f; color: #fff; border: none; border-radius: 6px;
  }
  #run:hover { background: #265c41; }
  #status { font-size: 0.9rem; color: #666; margin-left: auto; }
  #editor {
    width: 100%; height: 300px; box-sizing: border-box;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.95rem; padding: 0.6rem; border: 1px solid #bbb;
    border-radius: 6px; resize: vertical; tab-size: 4;
  }
  h2 { font-size: 1rem; margin: 1rem 0 0.3rem; }
  pre.pane {
    background: #f4f4f4; border: 1px solid #ddd; border-radius: 6px;
    padding: 0.6rem; min-height: 3em; white-space: pre-wrap;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.92rem; margin: 0;
  }
  @media (prefers-color-scheme: dark) {
    pre.pane { background: #1c1c1c; border-color: #444; }
    #editor { border-color: #555; background: #1c1c1c; color: #eee; }
  }
  #errors { color: #b00020; border-color: #e5a4ac; background: #fdf0f2; display: none; }
  @media (prefers-color-scheme: dark) {
    #errors { background: #2a1418; border-color: #6b2b35; }
  }
  .hint { font-size: 0.85rem; color: #666; }
</style>
</head>
<body>
  <h1>Niko 2 Playground</h1>
  <p class="sub">Write Niko, press <strong>Run</strong> — it compiles to WebAssembly
  right in your browser (via Pyodide) and runs. See
  <a href="README.md">README.md</a> for how it works and what's supported.</p>

  <div class="toolbar">
    <label for="examples">Example:</label>
    <select id="examples"></select>
    <button id="run" type="button">Run</button>
    <span id="status">starting…</span>
  </div>

  <textarea id="editor" spellcheck="false"
    placeholder="Write Niko here…"></textarea>
  <p class="hint">Tip: Ctrl+Enter (Cmd+Enter on Mac) runs the program.</p>

  <h2>Output</h2>
  <pre id="output" class="pane" aria-live="polite"></pre>

  <h2>Errors</h2>
  <pre id="errors" class="pane" aria-live="assertive"></pre>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.29.1/full/pyodide.js"></script>
  <script src="niko2_bundle.js"></script>
  <script src="playground.js"></script>
</body>
</html>
